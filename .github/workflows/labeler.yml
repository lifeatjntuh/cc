name: Pull Request Labeler

# ------------------------------------------------------------
# PAUSED — project is not yet ready for CI/CD.
# To re-enable: restore the commented-out 'on:' block below
# and remove the workflow_dispatch-only block.
# ------------------------------------------------------------

# on:
#   pull_request_target:
#     types: [opened, synchronize]

on:
  workflow_dispatch: # manual trigger only while paused


permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml