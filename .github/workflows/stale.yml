name: Mark stale issues and PRs

# ------------------------------------------------------------
# PAUSED — project is not yet ready for CI/CD.
# To re-enable: restore the commented-out 'on:' block below
# and remove the workflow_dispatch-only block.
# ------------------------------------------------------------

# on:
#   schedule:
#     - cron: "0 3 * * *"
#   workflow_dispatch:

on:
  workflow_dispatch: # manual trigger only while paused

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: >
            This issue has been inactive for 45 days and will be closed in
            14 days if there's no further activity. Comment if it's still
            relevant.
          stale-pr-message: >
            This PR has been inactive for 45 days and will be closed in 14
            days if there's no further activity.
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned"